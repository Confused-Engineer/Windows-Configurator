[package]
name = "windows_configurator"
version = "0.4.0"
edition = "2024"
rust-version = "1.95" # required by eframe 0.37
description = "Portable toolbox for setting up, troubleshooting and maintaining Windows PCs"
authors = ["Confused Engineer"]
repository = "https://github.com/Confused-Engineer/Windows-Configurator"
readme = "README.md"
publish = false

[[bin]]
name = "Windows_Configurator"
path = "src/main.rs"

[dependencies]
# UI: egui drawn on the CPU (src/cpu.rs). No Direct3D/OpenGL, so it renders
# the same in GPU-less VMs, RDP sessions and on real hardware.
egui = { version = "0.37.0", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.37.0", default-features = false, features = [
    "clipboard", # copy tokens, paste into text fields
    "links",     # hyperlinks open in the browser
] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4.8", default-features = false }
hdrshot-egui-backend = "0.2.0" # tile-caching CPU rasterizer for egui
bytemuck = "1"
image = { version = "0.25.10", default-features = false, features = ["png"] } # window icon
egui_extras = { version = "0.37.0", default-features = false, features = ["svg"] }
rust-ini = "0.21.3"
# HTTP downloads through the Windows TLS stack (SChannel) and certificate
# store, so corporate TLS-inspecting proxies work and no C toolchain is needed.
ureq = { version = "3.5.2", default-features = false, features = ["native-tls-no-default"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry", # needed by SHELLEXECUTEINFOW
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.34"
static_vcruntime = "3.0.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
strip = "symbols"
codegen-units = 1
panic = "abort"
