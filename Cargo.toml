[package]
name = "windows_configurator"
version = "0.4.0"
edition = "2024"
rust-version = "1.95" # required by eframe 0.37
description = "Portable toolbox for setting up, troubleshooting and maintaining Windows PCs"
authors = ["Confused Engineer"]
repository = "https://github.com/Confused-Engineer/Windows-Configurator"
readme = "README.md"
publish = false

[[bin]]
name = "Windows_Configurator"
path = "src/main.rs"

[dependencies]
# Both renderers are compiled in. wgpu (DirectX 12 / Vulkan, with a software
# WARP fallback) is tried first because it works in VMs and RDP sessions that
# only expose OpenGL 1.1; glow (OpenGL) is the fallback. See `src/main.rs`.
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",     # screen readers / UI Automation
    "clipboard",     # copy tokens, paste into text fields
    "default_fonts",
    "glow",
    "links",         # hyperlinks open in the browser
    "wgpu",
] }
egui_extras = { version = "0.37.0", default-features = false, features = ["svg"] }
rust-ini = "0.21.3"
# HTTP downloads through the Windows TLS stack (SChannel) and certificate
# store, so corporate TLS-inspecting proxies work and no C toolchain is needed.
ureq = { version = "3.5.2", default-features = false, features = ["native-tls-no-default"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry", # needed by SHELLEXECUTEINFOW
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Headless UI tests: drive the app through AccessKit and render pages offscreen.
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }

[build-dependencies]
winresource = "0.1.34"
static_vcruntime = "3.0.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
strip = "symbols"
codegen-units = 1
panic = "abort"
