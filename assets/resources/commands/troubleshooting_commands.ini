[SFC]
Scan Now = sfc /scannow & pause

[DISM]
Restore Health = Dism.exe /online /Cleanup-Image /RestoreHealth & pause
Clean WinSXS = Dism.exe /online /Cleanup-Image /StartComponentCleanup /ResetBase & pause

[Group Policy]
Force Update=gpupdate /force & pause
Generate Report=gpresult /h "%TEMP%\gpresult.html" /f && start "" "%TEMP%\gpresult.html"